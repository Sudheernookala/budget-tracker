name: Deploy Angular app to GitHub Pages

# Builds angular-app/ and publishes it at https://<user>.github.io/budget-tracker/
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main, Dev]
    paths: ['angular-app/**', '.github/workflows/deploy-angular.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular-app/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --base-href /budget-tracker/
      # Serve index.html for unknown paths too.
      - run: cp dist/budget-app/browser/index.html dist/budget-app/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: angular-app/dist/budget-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
